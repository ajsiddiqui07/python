<!-- Open the developer console in your browser and use console.log(), console.warn(), and console.error() to display a mock notification like Instagram's: log a successful post upload, warn if the caption is missing, and show an error if the image fails to upload. -->
<!DOCTYPE html>
<html>

<head>

</head>

<body>

    <script>
        console.log("Instagram: Your post was uploaded successfully!");

        console.warn("Instagram: Caption is missing!");

        console.error("Instagram: Image failed to upload!");
    </script>

</body>

</html>
