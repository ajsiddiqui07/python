<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const orders = [
    { orderId: 101, itemName: "Paneer Pizza", price: 299 },
    { orderId: 102, itemName: "Veg Burger", price: 149 },
    { orderId: 103, itemName: "Masala Dosa", price: 129 },
    { orderId: 104, itemName: "Chicken Biryani", price: 249 },
    { orderId: 105, itemName: "Chocolate Brownie", price: 99 }
];

    console.table(orders);
    </script>
</body>
</html>
