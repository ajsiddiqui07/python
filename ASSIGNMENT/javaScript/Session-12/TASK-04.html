<!-- Create a function addNewPlaylist() that sends a POST request using fetch() to https://jsonplaceholder.typicode.com/posts with a playlist object containing a name and description. Log the response JSON to the console.<br><br><em><strong>Hint:</strong> Use method: 'POST' and headers: { 'Content-Type': 'application/json' } in your fetch options.</em> -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Playlist</title>
</head>
<body>
    <h1>Add New Playlist</h1>

    <script>
        function addNewPlaylist() {

            const playlist = {
                name: "My Favorite Songs",
                description: "A playlist containing my favorite music tracks."
            };

            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(playlist)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Response JSON:');
                console.log(data);
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        addNewPlaylist();
    </script>
</body>
</html>
