<!-- Create a file called utils.js and write a function generateOrderId() that returns a random 8-character order ID string. Export this function using a named export, then import and use it in a separate file order.js to log a new order ID. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Order ID</title>
</head>
<body>

    <h1>Order ID Generator</h1>

    <p id="orderid"></p>

    <script type="module">
        import { generateOrderId } from "./01_utils.js";

        let orderid = generateOrderId();

        console.log("New order ID:", orderid);

        document.getElementById("orderid").textContent =
            "Generated Order ID: " + orderid;
    </script>

</body>
</html>
