
<!-- Simulate a Zomato order status updater using callbacks: write a function placeOrder that takes a food item and a callback, waits 1 second using setTimeout, then calls the callback with the message 'Your [item] is being prepared'. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zomato Order Status</title>
</head>
<body>

<h1>Check Console for Order Status</h1>

<script>
    function placeOrder(item, callback) {
        setTimeout(() => {
            callback(`Your Item :- (${item}) is being prepared`);
        }, 1000);
    }

    placeOrder("Burger", function(message) {
        console.log(message);
    });
</script>

</body>
</html>
