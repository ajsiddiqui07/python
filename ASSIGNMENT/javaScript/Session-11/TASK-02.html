
<!-- Create an HTML file with a <script> tag that logs 'Loading...' to the console, then after 2 seconds logs 'Content loaded!' using setTimeout. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Console Loading</title>
</head>
<body>

<h1>Check Console </h1>

<script>
    console.log("Loading...");

    setTimeout(() => {
        console.log("Content Loaded Successfull!");
    }, 2000);
</script>

</body>
</html>
