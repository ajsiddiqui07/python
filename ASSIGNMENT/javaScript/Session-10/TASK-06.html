<!-- You have two arrays: const cricketFans = ['Virat', 'Rohit']; const footballFans = ['Messi', 'Ronaldo']; Use the spread operator to combine both arrays into a single array called allFans and log the result.<br><br><em><strong>Hint:</strong> Use [...cricketFans, ...footballFans]</em> -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const cricketFans = ['MSD Sir', 'sachin Sir'];
        const footballFans = ['Messi Sir', 'Ronaldo Sir'];


        const allFans = [...cricketFans, ...footballFans];


        console.log(allFans);
    </script>
</body>

</html>
