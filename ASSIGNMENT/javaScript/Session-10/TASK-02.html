<!-- Create a template literal that displays a welcome message like Spotify: 'Hello, ${userName}! You have ${playlistCount} playlists.' Assign userName and playlistCount variables and log the message to the console. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let userName = "arbaz";
        let playlistCount = 7;

        let message = `Hello, ${userName}! You have ${playlistCount} playlists.`;

        console.log(message);
    </script>
</body>

</html>
