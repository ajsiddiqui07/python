<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StayFinder Newest PG Digest</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
    <h2 style="color: #1e3a5f;">StayFinder — Newest PG Listings</h2>
    <p>Check out the 3 newest PGs added on StayFinder:</p>
    <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th>PG Name</th>
                <th>Locality</th>
                <th>Monthly Rent</th>
                <th>Gender Type</th>
            </tr>
        </thead>
        <tbody>
            {% for pg in newest_pgs %}
            <tr>
                <td>{{ pg.name }}</td>
                <td>{{ pg.locality }}</td>
                <td>₹{{ pg.monthly_rent }}</td>
                <td>{{ pg.gender_type }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
