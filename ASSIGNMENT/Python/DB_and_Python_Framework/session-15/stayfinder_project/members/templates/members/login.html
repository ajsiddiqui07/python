{% extends 'listings/base.html' %}

{% block title %}Login — StayFinder{% endblock %}

{% block content %}
<h1>Login</h1>

<form method="post" class="stay-form" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Login</button>
</form>
<p><a href="{% url 'forgot_password' %}">Forgot password?</a></p>
{% endblock %}
