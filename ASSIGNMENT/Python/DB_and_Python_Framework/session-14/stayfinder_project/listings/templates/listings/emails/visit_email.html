<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visit Confirmation — StayFinder</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222;">
    <h2 style="color: #1e3a5f;">StayFinder</h2>
    <p>Hello {{ visitor_name }},</p>
    <p>Your visit request is received for <strong>{{ visit_date }}</strong> ({{ people_count }} guest(s)).</p>

    <h3>Featured PGs</h3>
    <table border="1" cellpadding="8" cellspacing="0" style="border-collapse: collapse;">
        <thead>
            <tr>
                <th>PG Name</th>
                <th>Locality</th>
                <th>Monthly Rent</th>
            </tr>
        </thead>
        <tbody>
            {% for pg in featured_pgs %}
            <tr>
                <td>{{ pg.name }}</td>
                <td>{{ pg.locality }}</td>
                <td>₹{{ pg.monthly_rent }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
