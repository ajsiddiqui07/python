{% extends 'listings/base.html' %}

{% block title %}Add PG — StayFinder{% endblock %}

{% block content %}
<h1>Add New PG / Hostel</h1>
<p><a href="{% url 'add_locality' %}">+ Add a new locality</a></p>

<form method="post" class="stay-form" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Save PG</button>
</form>
{% endblock %}
