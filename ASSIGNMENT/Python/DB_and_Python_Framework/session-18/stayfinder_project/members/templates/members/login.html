{% extends 'listings/base.html' %}
{% load socialaccount %}

{% block title %}Login — StayFinder{% endblock %}

{% block content %}
<h1>Login</h1>

<form method="post" class="stay-form" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Login</button>
</form>

<p style="margin-top: 14px;">
    <a href="{% provider_login_url 'google' %}" class="btn-primary" style="display: inline-block; text-decoration: none;">
        Sign in with Google
    </a>
</p>
<p><a href="{% url 'forgot_password' %}">Forgot password?</a></p>
{% endblock %}
