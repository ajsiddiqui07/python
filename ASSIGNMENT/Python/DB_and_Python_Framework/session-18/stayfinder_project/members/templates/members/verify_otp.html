{% extends 'listings/base.html' %}

{% block title %}Verify OTP — StayFinder{% endblock %}

{% block content %}
<h1>Verify OTP</h1>

{% if error %}
<p class="errorlist">{{ error }}</p>
{% endif %}

<form method="post" class="stay-form" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Verify OTP</button>
</form>
{% endblock %}
